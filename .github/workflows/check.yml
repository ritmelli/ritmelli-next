name: Check

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.15"
      - run: uv sync --locked
      - run: uv run ruff check --ignore-noqa
        if: ${{ !cancelled() }}
      - run: uv run ruff format --check
        if: ${{ !cancelled() }}
      - run: uv run pyright
        if: ${{ !cancelled() }}
      - run: uv run lint-imports
        if: ${{ !cancelled() }}
      - run: uv run python tools/check_layout.py
        if: ${{ !cancelled() }}
      - run: uv run python tools/lint/run.py
        if: ${{ !cancelled() }}
      - run: uv run pytest
        if: ${{ !cancelled() }}
      - name: The ring layout under g++
        if: ${{ !cancelled() }}
        run: |
          g++ -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/describe" filter/abi/describe.cpp
          "$RUNNER_TEMP/describe" "$RUNNER_TEMP/ring.layout.json"
          diff -u filter/abi/ring.layout.json "$RUNNER_TEMP/ring.layout.json"
      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
