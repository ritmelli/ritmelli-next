name: Windows

on:
  pull_request:
    paths:
      - src/ritmelli/machine/**
      - src/ritmelli/ports/**
      - src/ritmelli/update/**
      - src/ritmelli/app.py
      - filter/**
      - installer/**

permissions:
  contents: read

jobs:
  pytest:
    name: Windows pytest
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.15"
      - run: uv sync --locked
      - run: uv run pytest src/ritmelli/machine src/ritmelli/ports src/ritmelli/update
      - name: The two SYSTEM tasks and the hook
        if: ${{ !cancelled() }}
        run: ./installer/e2e/tasks.ps1
