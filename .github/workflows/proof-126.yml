name: Proof 126

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux-imports:
    name: Linux imports, undone and as merged
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.15"
      - run: uv sync --locked
      - run: uv run python proof/linux_imports.py
