name: Build

on:
  pull_request:
    paths:
      - installer/**
      - filter/**
      - src/ritmelli/machine/**
      - src/ritmelli/update/**
      - src/ritmelli/app.py
      - .github/actions/inno-setup/**
  workflow_dispatch:
    inputs:
      version:
        description: The version of the test build, 0.900.N
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '0.900.0' }}

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.15"
      - uses: ./.github/actions/inno-setup
      - name: Freeze
        shell: powershell
        run: installer\build.ps1 -Version $env:VERSION -Channel test
      - name: The exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path dist\ritmelli\ritmelli.exe).Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne 'Ritmelli' -or $info.ProductVersion -ne $env:VERSION) { throw "the exe says $($info.ProductName) $($info.ProductVersion)" }
          $runw = (Select-String installer\bootloader\bin\FONTE.txt -Pattern '^([0-9a-f]{64})  runw\.exe$').Matches[0].Groups[1].Value
          $venv = "$env:LOCALAPPDATA\ritmelli-next-build\Lib\site-packages\PyInstaller\bootloader\Windows-64bit-intel"
          if ((Get-FileHash "$venv\runw.exe" -Algorithm SHA256).Hash -ne $runw) { throw 'the runw.exe of the venv is not the one in FONTE.txt' }
          # a mode must not show a window, leave a process listening on a port, or create a file in LOCALAPPDATA
          $watcher = [IO.FileSystemWatcher]::new($env:LOCALAPPDATA)
          $watcher.IncludeSubdirectories = $true
          $null = Register-ObjectEvent $watcher Created -SourceIdentifier created
          function Exits($code, $arguments) {
            $watcher.EnableRaisingEvents = $true
            # not by the shell, which writes its own caches in LOCALAPPDATA
            $start = [Diagnostics.ProcessStartInfo]::new($exe, $arguments)
            $start.UseShellExecute = $false
            $started = Get-Date
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $p = [Diagnostics.Process]::Start($start)
            $window = $false
            while (-not $p.WaitForExit(20)) {
              # the handle reads as null, which is -ne 0, when the exe exits between the two calls
              $p.Refresh(); $window = $window -or [long]$p.MainWindowHandle -ne 0
              if ($clock.Elapsed.TotalSeconds -ge 5) { $p.Kill(); throw "ritmelli.exe $arguments still runs after 5 s; window: $window" }
            }
            $seconds = $clock.Elapsed.TotalSeconds
            Start-Sleep -Milliseconds 500
            $watcher.EnableRaisingEvents = $false
            $files = @(Get-Event -SourceIdentifier created -ErrorAction SilentlyContinue | ForEach-Object { $_.SourceEventArgs.FullPath; Remove-Event -EventIdentifier $_.EventIdentifier })
            $ports = @(Get-NetTCPConnection -State Listen | Where-Object { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).StartTime -ge $started } | ForEach-Object LocalPort)
            "ritmelli.exe $arguments exited with $($p.ExitCode) in $seconds s; window: $window; new ports: $ports; new files: $files"
            if ($p.ExitCode -ne $code -or $seconds -ge 5 -or $window -or $ports -or $files) { throw "ritmelli.exe $arguments should exit with $code in under 5 s and leave nothing" }
          }
          Exits 2 '--nao-existe'
          $json = Join-Path $env:RUNNER_TEMP 'describe.json'
          Exits 0 "--describe `"$json`""
          $described = (Get-Content $json -Raw | ConvertFrom-Json).version
          if ($described -ne $env:VERSION) { throw "--describe wrote the version $described" }
          Exits 0 ''
      - name: Build info
        shell: powershell
        run: |
          $env:UV_PROJECT_ENVIRONMENT = "$env:LOCALAPPDATA\ritmelli-next-build"
          # from the describe.json the exe wrote in the step above
          uv run --no-sync python installer\build_info.py "$env:RUNNER_TEMP\describe.json" dist\build-info.json dist\ritmelli\ritmelli.exe "dist\Ritmelli-$env:VERSION-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "build_info.py exited with $LASTEXITCODE" }
          Get-Content dist\build-info.json
          $sources = Get-Content dist\ritmelli\_internal\microfone\micfx.sources -Raw
          if ((Get-Content dist\build-info.json -Raw | ConvertFrom-Json).filter_sources -ne $sources) { throw "filter_sources is not the micfx.sources $sources" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-${{ env.VERSION }}
          path: |
            dist/build-info.json
            dist/ritmelli/ritmelli.exe
            dist/Ritmelli-${{ env.VERSION }}-setup.exe
          if-no-files-found: error
      - name: The sources digest follows the top of filter/apo/ only
        shell: powershell
        run: |
          $env:UV_PROJECT_ENVIRONMENT = "$env:LOCALAPPDATA\ritmelli-next-build"
          $tree = "$env:RUNNER_TEMP\digest"
          git worktree add --detach $tree HEAD
          function Digest {
            uv run --no-sync python "$tree\installer\build_info.py" sources "$env:RUNNER_TEMP\digest.txt"
            if ($LASTEXITCODE -ne 0) { throw "build_info.py exited with $LASTEXITCODE" }
            Get-Content "$env:RUNNER_TEMP\digest.txt"
          }
          function Commit($path) {
            Add-Content "$tree\$path" 'rem a comment'
            git -C $tree add -A
            git -C $tree -c user.name=build -c user.email=build@localhost commit -q -m "a comment in $path"
            if ($LASTEXITCODE -ne 0) { throw "git commit exited with $LASTEXITCODE" }
          }
          $first = Digest
          $null = New-Item -ItemType Directory "$tree\filter\abi" -Force
          Commit filter\abi\layout.txt
          if ((Digest) -ne $first) { throw 'a commit in filter/abi/ changed the sources digest' }
          Commit filter\apo\compila.bat
          $second = Digest
          "sources digest: $first, then $second"
          if ($second -eq $first) { throw 'a comment in compila.bat did not change the sources digest' }
      - name: Without the package in the venv, the exe lacks the modules found by folder and build info refuses
        shell: powershell
        run: |
          # the recipe then freezes only what app.py imports, from src, and no module found by folder
          $env:UV_PROJECT_ENVIRONMENT = "$env:LOCALAPPDATA\ritmelli-next-build"
          $env:RITMELLI_VERSION = $env:VERSION
          $bare = "$env:RUNNER_TEMP\bare"
          uv pip uninstall --python "$env:UV_PROJECT_ENVIRONMENT\Scripts\python.exe" ritmelli
          if ($LASTEXITCODE -ne 0) { throw "uv pip uninstall exited with $LASTEXITCODE" }
          uv run --no-sync pyinstaller --noconfirm --log-level ERROR --distpath $bare --workpath "$bare\work" installer\ritmelli.spec
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller exited with $LASTEXITCODE" }
          uv sync --locked --group build
          if ($LASTEXITCODE -ne 0) { throw "uv sync exited with $LASTEXITCODE" }
          $exe = [Diagnostics.Process]::Start("$bare\ritmelli\ritmelli.exe", "--describe `"$bare\describe.json`"")
          if (-not $exe.WaitForExit(5000)) { $exe.Kill(); throw 'ritmelli.exe --describe still runs after 5 s' }
          $held = @((Get-Content "$bare\describe.json" -Raw | ConvertFrom-Json).modules)
          $all = @((Get-Content dist\build-info.json -Raw | ConvertFrom-Json).modules)
          "the exe frozen without the package holds $($held.Count) of the $($all.Count) modules: $held"
          if ($held.Count -ge $all.Count) { throw 'the exe frozen without the package holds every module' }
          uv run --no-sync python installer\build_info.py "$bare\describe.json" "$bare\build-info.json" "$bare\ritmelli\ritmelli.exe"
          if ($LASTEXITCODE -ne 1) { throw "build_info.py exited with $LASTEXITCODE, not 1" }
          $global:LASTEXITCODE = 0

  e2e-clean:
    name: Clean machine
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-${{ env.VERSION }}
          path: ${{ runner.temp }}/build
      - name: The setup without the hook, then with it, over itself, and uninstalled
        shell: powershell
        run: installer\e2e\clean_machine.ps1 -Build "$env:RUNNER_TEMP\build"
