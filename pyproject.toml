[project]
name = "ritmelli"
version = "0.0.0"
description = "Ritmelli, the next version: work repository"
license = "GPL-3.0-only"
requires-python = "==3.12.*"
dependencies = [
    "certifi",
    "pycryptodomex==3.24.2",
    "sounddevice>=0.5",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "import-linter",
    "pyright",
    "pytest",
    "pytest-timeout",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
