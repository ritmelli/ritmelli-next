target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F", "B", "C901", "PLR0915", "PTH123", "T20", "TID251"]

[lint.per-file-ignores]
"!src/ritmelli/features/**" = ["PTH123", "T20", "TID251"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 40

[lint.flake8-tidy-imports.banned-api]
"glob".msg = "A handler does no I/O. Return an effect."
"http.client".msg = "A handler does no I/O. Return an effect."
"io".msg = "A handler does no I/O. Return an effect."
"logging".msg = "A handler does no I/O. Return an effect."
"os".msg = "A handler does no I/O. Return an effect."
"pathlib".msg = "A handler does no I/O. Return an effect."
"shutil".msg = "A handler does no I/O. Return an effect."
"socket".msg = "A handler does no I/O. Return an effect."
"sqlite3".msg = "A handler does no I/O. Return an effect."
"ssl".msg = "A handler does no I/O. Return an effect."
"tempfile".msg = "A handler does no I/O. Return an effect."
"urllib.request".msg = "A handler does no I/O. Return an effect."
"pytest.mark.timeout".msg = "Every test gets 2 s, set in pytest.ini."
