extend-exclude = ["tools/lint/ruff"]
[lint]
select = [
    "E4", "E7", "E9", "F", "B", "C901", "PLR0915", "PTH123", "T20", "TID251", "INP001", "I001", "RUF",
    "ERA", "S110", "S112", "ISC", "PIE", "RET", "C4", "UP", "DTZ", "SLF", "PGH", "PLE", "LOG", "G", "FURB", "ARG", "A",
]

[lint.per-file-ignores]
"!src/ritmelli/features/**" = ["PTH123", "T20", "TID251"]
"!src/**" = ["INP001"]
"**/*_test.py" = ["ARG", "A002"]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 40

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-tidy-imports.banned-api]
"asyncio".msg = "A handler does no I/O. Return an effect."
